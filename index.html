<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Runtext · Ruta GPX amb lletres per al rellotge</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--ink:#14261f;--paper:#f3f6f1;--line:#c9d6cc;--route:#e4572e;--accent:#1f6f54}
*{box-sizing:border-box}
html,body{height:100%;margin:0;font:15px/1.4 system-ui,sans-serif;color:var(--ink);background:var(--paper)}
body{display:flex;flex-direction:column}
header{padding:12px 14px;border-bottom:1px solid var(--line);display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
h1{grid-column:1/-1;margin:0;font:700 20px/1.2 Georgia,serif}
label{display:grid;gap:3px;font-size:13px}
input,button{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-width:0}
input[type=text]{text-transform:uppercase;letter-spacing:.08em}
button{background:var(--accent);color:#fff;border-color:var(--accent);cursor:pointer}
button.sec{background:#fff;color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--route);outline-offset:1px}
#msg{grid-column:1/-1;font-size:13px;min-height:1.4em}
#map{flex:1;min-height:300px}
</style>
</head>
<body>
<header>
<h1>Runtext <span style="font:400 14px system-ui,sans-serif">Escriu amb els peus: ruta GPX amb lletres</span></h1>
<label>Text (A-Z, 0-9, màx. 12)<input id="txt" type="text" maxlength="12" value="ALBERT"></label>
<label>Quilòmetres<input id="km" type="number" min="1" max="100" step="0.5" value="10"></label>
<label>Rotació (<span id="rv">0</span>°)<input id="rot" type="range" min="-90" max="90" value="0"></label>
<label>Cerca un lloc<input id="q" type="text" style="text-transform:none;letter-spacing:0" placeholder="Ciutat o barri"></label>
<button class="sec" id="go">Cerca</button>
<button id="gen">Genera ruta</button>
<button class="sec" id="dl" disabled>Baixa el GPX</button>
<div id="msg">Clica el mapa per triar el centre del text.</div>
</header>
<div id="map"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// Lletres d'un sol traç sobre una graella de 4x6; cada parell de xifres = (x,y); les coma separen traços.
const G={A:"002640,1333",B:"00063645340434433000",C:"4536160501103041",D:"00063645413000",E:"46060040,0333",F:"460600,0333",G:"45361605011030414323",H:"0006,4046,0343",I:"1636,2620,1030",J:"3631201001",K:"0006,460340",L:"060040",M:"0006234640",N:"00064046",O:"100105163645413010",P:"000636453404",Q:"100105163645413010,2240",R:"000636453404,2440",S:"453616050413334241301001",T:"0646,2620",U:"060110304146",V:"062046",W:"0610233046",X:"0640,0046",Y:"0623,4623,2320",Z:"06460040",
0:"100105163645413010",1:"152620",2:"05163645340040",3:"0516364534243342311001",4:"30360243",5:"4606033342311001",6:"4536160501103041423303",7:"064620",8:"14030110304143341405163645"+"34",9:"0110304145361605041343"};
const $=id=>document.getElementById(id);
const map=L.map('map').setView([41.39,2.17],13);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map);
const mk=L.marker(map.getCenter(),{draggable:true}).addTo(map);
const free=L.polyline([],{color:'#1f6f54',weight:2,dashArray:'4 5'}).addTo(map);
const route=L.polyline([],{color:'#e4572e',weight:5,opacity:.9}).addTo(map);
let pts=[],busy=false;
const msg=t=>$('msg').textContent=t;

function glyphs(t){
 t=t.toUpperCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
 const S=[];let x=0;
 for(const c of t){const g=G[c];if(g)for(const s of g.split(',')){const p=[];for(let i=0;i<s.length;i+=2)p.push([+s[i]+x,+s[i+1]]);S.push(p)}x+=6}
 const w=x-2;return S.map(s=>s.map(([a,b])=>[a-w/2,b-3]));
}
const ulen=S=>{let l=0,p=null;for(const s of S)for(const q of s){if(p)l+=Math.hypot(q[0]-p[0],q[1]-p[1]);p=q}return l};
function place(S,m){
 const c=mk.getLatLng(),r=+$('rot').value*Math.PI/180,co=Math.cos(r),si=Math.sin(r),k=111320*Math.cos(c.lat*Math.PI/180);
 return S.map(s=>s.map(([x,y])=>[c.lat+((x*si+y*co)*m)/111320,c.lng+((x*co-y*si)*m)/k]));
}
function dens(L){
 const A=L.flat(),o=[A[0]];
 for(let i=1;i<A.length;i++){const a=A[i-1],b=A[i],n=Math.max(1,Math.ceil(map.distance(a,b)/120));
  for(let k=1;k<=n;k++)o.push([a[0]+(b[0]-a[0])*k/n,a[1]+(b[1]-a[1])*k/n])}
 return o;
}
async function snap(P){
 const out=[];let dist=0;
 for(let i=0;i<P.length-1;i+=39){
  const q=P.slice(i,i+40).map(p=>p[1]+','+p[0]).join(';');
  const r=await fetch('https://routing.openstreetmap.de/routed-foot/route/v1/driving/'+q+'?overview=full&geometries=geojson&continue_straight=false');
  const j=await r.json();
  if(j.code!=='Ok')throw new Error(j.message||j.code);
  dist+=j.routes[0].distance;
  out.push(...j.routes[0].geometry.coordinates.map(c=>[c[1],c[0]]));
 }
 return {out,dist};
}
function draw(){
 if(busy)return;
 const S=glyphs($('txt').value);
 route.setLatLngs([]);pts=[];$('dl').disabled=true;
 free.setLatLngs(S.length?place(S,$('km').value*1000/ulen(S)/1.35):[]);
}
async function gen(){
 const S=glyphs($('txt').value);
 if(!S.length)return msg('Escriu alguna lletra o xifra (A-Z, 0-9).');
 const target=$('km').value*1000;let m=target/ulen(S)/1.35,res;
 busy=true;$('gen').disabled=true;$('dl').disabled=true;
 try{
  for(let it=1;it<=3;it++){
   msg('Calculant ruta pels carrers… ('+it+'/3)');
   const L=place(S,m);free.setLatLngs(L);
   res=await snap(dens(L));
   const f=target/res.dist;
   if(Math.abs(f-1)<.08)break;
   m*=f;
  }
  pts=res.out;route.setLatLngs(pts);map.fitBounds(route.getBounds());
  msg('Ruta llesta: '+(res.dist/1000).toFixed(1)+' km reals.');$('dl').disabled=false;
 }catch(e){msg('No s\'ha pogut calcular la ruta: '+e.message+'. Prova una altra zona o torna-ho a provar.')}
 busy=false;$('gen').disabled=false;
}
function gpx(){
 const n=$('txt').value.trim().replace(/[&<>]/g,'');
 const x='<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="Ruta de lletres" xmlns="http://www.topografix.com/GPX/1/1"><trk><name>'+n+'</name><trkseg>'+pts.map(p=>'<trkpt lat="'+p[0].toFixed(6)+'" lon="'+p[1].toFixed(6)+'"/>').join('')+'</trkseg></trk></gpx>';
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([x],{type:'application/gpx+xml'}));
 a.download=(n||'ruta').replace(/\W+/g,'_')+'.gpx';a.click();
}
async function search(){
 try{
  const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&q='+encodeURIComponent($('q').value));
  const j=await r.json();
  if(!j[0])return msg('No s\'ha trobat el lloc.');
  map.setView([j[0].lat,j[0].lon],14);mk.setLatLng([j[0].lat,j[0].lon]);draw();
 }catch(e){msg('Error en la cerca: '+e.message)}
}
map.on('click',e=>{mk.setLatLng(e.latlng);draw()});
mk.on('dragend',draw);
['txt','km','rot'].forEach(i=>$(i).addEventListener('input',()=>{$('rv').textContent=$('rot').value;draw()}));
$('gen').onclick=gen;$('dl').onclick=gpx;$('go').onclick=search;
$('q').addEventListener('keydown',e=>{if(e.key==='Enter')search()});
draw();
</script>
</body>
</html>
